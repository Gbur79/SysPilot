[workspace]
members = [
    "crates/syspilot-core",
    "crates/syspilot-tray",
    "crates/syspilot-gui",
]
resolver = "2"

[workspace.package]
version = "2.0.2"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
