[package]
name = "syspilot-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
zbus = "6.3"

[dev-dependencies]
tempfile = "3.27"
insta = { version = "1.49.0", features = ["json"] }
