[package]
name = "syspilot-tray"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[dependencies]
ksni = "0.3.6"
libc = "0.2"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "rt", "signal", "sync", "time"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
